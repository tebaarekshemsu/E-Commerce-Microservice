syntax = "proto3";

package user;

option go_package = "github.com/tebaarekshemsu/e-commerce/project/protos/user";

service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  string id = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
}
