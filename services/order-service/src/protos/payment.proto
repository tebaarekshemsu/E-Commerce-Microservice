syntax = "proto3";

package payment;

option go_package = "github.com/tebaarekshemsu/e-commerce/project/protos/payment";

service PaymentService {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
}

message PaymentRequest {
  string order_id = 1;
  float amount = 2;
  string currency = 3;
  string payment_method = 4; // e.g., "credit_card"
}

message PaymentResponse {
  bool success = 1;
  string transaction_id = 2;
  string message = 3;
}
